org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Suppress noisy sync issue while dependency constraints are enabled for large graphs.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
# Required while Hilt / Google Services / Crashlytics still use the legacy variant API.
android.newDsl=false
android.builtInKotlin=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
