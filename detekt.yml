build:
  maxIssues: 0

config:
  validation: true

complexity:
  LongMethod:
    active: true
    threshold: 100
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 8
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: true
    thresholdInClasses: 25
    thresholdInObjects: 25
    thresholdInFiles: 30
  CyclomaticComplexMethod:
    active: true
    threshold: 30
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    active: true
    threshold: 6

style:
  ReturnCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: true
    maxJumpCount: 10
  # Matches project ktlint config (wildcards allowed).
  WildcardImport:
    active: false
  # Domain/geo code uses many numeric thresholds; prefer named consts in review for new code.
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  UseCheckOrError:
    active: false

exceptions:
  # Network/load boundaries intentionally catch broadly after rethrowing CancellationException.
  TooGenericExceptionCaught:
    active: false

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
